<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | JuJutsu Vault</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/ranking.css">
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/perfil.css">
    <link rel="icon" href="./assets/icon/avatar6.svg" type="image/svg">

    <script src="./js/perfil.js" defer></script>
    <script src="./js/utils/alternarSecao.js" defer></script>
    <script src="./js/dashboards/individual.js" defer></script>
    <script src="./js/ranking.js" defer></script>
    <script src="./js/sessao.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header class="navbar">
        <div class="container navbar_container">

            <a href="./index.html" class="navbar_logo">
                <img src="./assets/imgs/logo.png" alt="JuJutsu Vault Logo">
            </a>

            <nav class="navbar_nav">
                <a href="./index.html">Início</a>
                <a href="#">Personagens</a>
                <a href="./quiz.html">Quiz</a>
                <a href="./ranking.html">Visão Geral</a>
                <a href="#">História</a>
                <a href="./posts.html">Posts</a>
                <a href="./criar-post.html">Publicar</a>
            </nav>

            <div class="navbar_actions">
                <a href="./perfil.html">Perfil</a>
                <button onclick="limparSessao()">Sair</button>
            </div>

        </div>
    </header>

    <main>
        <section class="perfil container">
            <div class="perfil-container">
                <div class="menu">
                    <button class="item active">
                        <h2>Configurações</h2>
                    </button>
                    <button class="item">
                        <h2>Visão Geral</h2>
                    </button>
                    <button class="item">
                        <h2>Ranking</h2>
                    </button>
                    <button class="item">
                        <h2>Histórico</h2>
                    </button>
                </div>

                <div class="content">
                    <section id="config" class="section active">
                        <div class="perfil-header">
                            <div class="perfil-info">
                                <img src="" class="avatar perfil-avatar">

                                <div class="user">
                                    <h3 id="user-name"></h3>
                                    <span id="user-email"></span>
                                </div>
                            </div>

                            <button class="white-btn" id="edit-btn">EDITAR</button>
                        </div>

                        <div class="config-container">
                            <div class="form-grid">

                                <div class="input-group">
                                    <label>Nome</label>
                                    <input id="input-name" type="text" placeholder="" disabled>
                                </div>

                                <div class="input-group">
                                    <label>Email</label>
                                    <input id="input-email" type="text" placeholder="" disabled>
                                </div>

                                <div class="input-group">
                                    <label>Confirmar senha atual</label>
                                    <input id="current-password" type="password" placeholder="******" disabled>
                                </div>

                                <div class="input-group">
                                    <label>Senha nova</label>
                                    <input id="new-password" type="password" placeholder="Digite uma nova senha"
                                        disabled>
                                </div>

                            </div>

                            <div class="avatar-section">
                                <h3>Mudar avatar</h3>

                                <div class="avatar-list">
                                    <img src="./assets/icon/avatar1.svg" class="avatar">
                                    <img src="./assets/icon/avatar2.svg" class="avatar">
                                    <img src="./assets/icon/avatar3.svg" class="avatar">
                                    <img src="./assets/icon/avatar4.svg" class="avatar">
                                    <img src="./assets/icon/avatar5.svg" class="avatar">
                                    <img src="./assets/icon/avatar6.svg" class="avatar">
                                    <img src="./assets/icon/avatar7.svg" class="avatar">
                                    <img src="./assets/icon/avatar8.svg" class="avatar">
                                </div>
                            </div>

                            <div class="actions hidden">
                                <button id="cancel-btn" class="white-btn">Cancelar</button>
                                <button id="save-btn" class="btn">Salvar</button>
                            </div>

                        </div>
                    </section>
                    <section id="visao" class="section">

                        <div class="perfil-header">

                            <div class="perfil-info">
                                <img src="" class="avatar perfil-avatar">

                                <div class="user">
                                    <h3 id="user-name"></h3>
                                    <span id="user-email"></span>
                                </div>
                            </div>

                            <div class="perfil-nivel">
                                <div class="titulo">
                                    FEITICEIRO <span id="nivel-titulo" style="text-transform: uppercase;"></span>
                                    <div class="barra-container">
                                        <div class="barra-progresso" id="barra-progresso"></div>
                                    </div>    
                                </div>
                                
                                <div class="perfil-proximo-nivel">
                                    <div id="faltam-nivel"></div>
                                    <div id="proximo-nivel"></div>
                                </div>
                            </div>

                            <div class="titulo">
                                <span id="posicao-usuario" style="font-weight: 600;"></span> NO RANKING
                            </div>
                        </div>

                        <div class="kpis top">
                            <div class="kpi">
                                <h2>Média de Acertos</h2>
                                <p id="media-acertos"></p>
                            </div>
                            <div class="kpi">
                                <h2>Melhor Pontuação</h2>
                                <p id="melhor-pontuacao"></p>
                            </div>
                            <div class="kpi">
                                <h2>Tempo Médio</h2>
                                <p id="tempo-medio"></p>
                            </div>
                            <div class="kpi">
                                <h2>Total de Tentativas</h2>
                                <p id="total-tentativas"></p>
                            </div>
                        </div>

                        <div class="graficos">
                            <canvas class="dashboard-chart"></canvas>
                            <canvas class="dashboard-pizza"></canvas>
                        </div>
                    </section>

                    <section id="ranking" class="section container">
                        <h1>
                            Você está na posição: <span id="posicao-usuario" style="font-weight: 600;"></span>
                        </h1>

                        <div>
                            <div class="ranking-header">
                                <span>Rank</span>
                                <span>Nome</span>
                                <span>Pontuação</span>
                                <span>Tempo</span>
                                <span>Data</span>
                            </div>

                            <div class="ranking-list"></div>
                        </div>
                    </section>

                    <section id="historico" class="section container">
                        <h1>Suas Tentativas</h1>

                        <div class="tentativa-header">
                            <span>Data</span>
                            <span>Pontuação</span>
                            <span>Tempo</span>
                        </div>

                        <div class="tentativas-list"></div>
                    </section>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
