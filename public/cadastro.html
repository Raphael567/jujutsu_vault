<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuJutsu Vault | Cadastro</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/login_cadastro.css">
    <link rel="icon" href="./assets/icon/avatar6.svg" type="image/svg">

    <script src="./js/cadastro.js" defer></script>
</head>

<body>
    <section class="cadastro">
        <img src="./assets/imgs/cadastro/todo_bg.svg" alt="Aoi Todo" class="decor">

        <div class="form">
            <div class="menu">
                <button class="item login-btn">
                    <a href="./login.html"><h2>Login</h2></a>
                </button>
                <button class="item cadastro-btn active">
                    <h2>Cadastro</h2>
                </button>
            </div>

            <div class="welcome">
                <h1>
                    <span>Torne-se um</span>
                    <span>Feticeiro JuJutsu</span>
                </h1>
                <h2>Por Favor, coloque suas credenciais</h2>
            </div>

            <div class="inputs">
                <div class="ipt">
                    <span>Nome:</span>
                    <input id="nome_input" type="text" placeholder="Seu nome">
                </div>

                <div class="ipt">
                    <span>Email:</span>
                    <input id="email_input" type="text" placeholder="meuemail@provedor.com">
                </div>  

                <div class="ipt">
                    <span>Senha:</span>
                    <input id="senha_input" type="password" placeholder="******">
                </div>

                <div class="ipt">
                    <span>Confirmar Senha:</span>
                    <input id="confirmacao_senha_input" type="password" placeholder="******">
                </div>
            </div>

            <button onclick="cadastrar()" class="btn" id="cadastro-btn">Cadastrar-Se</button>
            <h1 id="error_msg_cadastro"></h1>
        </div>
    </section>
</body>

</html>
