<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuJutsu Vault | Login</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">

    <script src="./js/auth.js" defer></script>
    <script src="./js/utils/alternarSecao.js" defer></script>
</head>

<body>
    <section class="section active">
        <section class="login">
            <div class="form">

                <div class="menu">
                    <button class="item login-btn active">
                        <h2>Login</h2>
                    </button>
                    <button class="item cadastro-btn">
                        <h2>Cadastro</h2>
                    </button>
                </div>

                <div class="welcome">
                    <h1>
                        <span>Bem Vindo de</span>
                        <span>Volta Feiticeiro</span>
                    </h1>
                    <h2>Por Favor, coloque suas credenciais</h2>
                </div>

                <div class="inputs">
                    <div class="ipt">
                        <span>Email:</span>
                        <input id="email_login" type="text" placeholder="Login">
                    </div>

                    <div class="ipt">
                        <span>Senha:</span>
                        <input id="senha_login" type="password" placeholder="******">
                    </div>
                </div>

                <button onclick="entrar()" class="btn" id="login-btn">Login</button>
                <h1 id="error_msg_login"></h1>
            </div>
            <img src="./assets/imgs/login/gojo_bg.svg" alt="Satoru Gojo" class="decor decor-1">
            <img src="./assets/imgs/login/toji_bg.svg" alt="Toji Fushiguro Renascido" class="decor decor-2">
        </section>
    </section>

    <section class="section">
        <section class="cadastro">
            <img src="./assets/imgs/cadastro/todo_bg.svg" alt="Aoi Todo" class="decor">

            <div class="form">
                <div class="menu">
                    <button class="item login-btn">
                        <h2>Login</h2>
                    </button>
                    <button class="item cadastro-btn">
                        <h2>Cadastro</h2>
                    </button>
                </div>

                <div class="welcome">
                    <h1>
                        <span>Torne-se um</span>
                        <span>Feticeiro JuJutsu</span>
                    </h1>
                    <h2>Por Favor, coloque suas credenciais</h2>
                </div>

                <div class="inputs">
                    <div class="ipt">
                        <span>Nome:</span>
                        <input id="nome_cadastro" type="text" placeholder="Seu nome">
                    </div>

                    <div class="ipt">
                        <span>Email:</span>
                        <input id="email_cadastro" type="text" placeholder="meuemail@provedor.com">
                    </div>

                    <div class="ipt">
                        <span>Senha:</span>
                        <input id="senha_cadastro" type="password" placeholder="******">
                    </div>

                    <div class="ipt">
                        <span>Confirmar Senha:</span>
                        <input id="confirmacao_senha_cadastro" type="password" placeholder="******">
                    </div>
                </div>

                <button onclick="cadastrar()" class="btn" id="cadastro-btn">Cadastrar-Se</button>
                <h1 id="error_msg_cadastro"></h1>
            </div>
        </section>
    </section>
</body>

</html>
