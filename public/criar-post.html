<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JuJutsu Vault | Criar Post</title>

    <link rel="icon" href="./assets/icon/avatar6.svg" type="image/svg">

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/criar-post.css">
</head>

<body>
    <header class="navbar">
        <div class="container navbar_container">

            <a href="./index.html" class="navbar_logo">
                <img src="./assets/imgs/logo.svg" alt="JuJutsu Vault Logo">
            </a>

            <nav class="navbar_nav">
                <a href="./index.html">Início</a>
                <a href="#">Personagens</a>
                <a href="./quiz.html">Quiz</a>
                <a href="./ranking.html">Visão Geral</a>
                <a href="#">História</a>
                <a href="#">Posts</a>
            </nav>

            <div class="navbar_actions">
                <a href="./perfil.html">Perfil</a>
                <button onclick="limparSessao()">Sair</button>
            </div>

        </div>
    </header>

    <section class="pagina-criar-post">

        <h1>Criar Post</h1>

        <div class="form-post">
            <input type="text" id="iptTitulo" placeholder="Título">

            <select id="selectCategoria">
                <option>Feiticeiros</option>
                <option>Maldições</option>
                <option>Técnicas</option>
                <option>Clãs</option>
                <option>Arcos</option>
                <option>Análises</option>
            </select>

            <textarea id="iptResumo" placeholder="Faça um breve resumo do seu artigo"></textarea>

            <textarea id="iptConteudo" placeholder="Conteúdo completo"></textarea>

            <button onclick="criarPost()">Publicar</button>

        </div>

    </section>
</body>

</html>
